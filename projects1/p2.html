<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project 2</title>
  </head>
  <body>
    <h1>Project 2</h1>
    <form action="get">
      <label> Height:- </label>
      <input type="text" id="height" />
      <br />
      <label> weight:- </label>
      <input type="text" id="weight" />
      <br />
      <br />
      <button type="submit">calculate</button>
      <br />
      <div id="result"></div>
    </form>
    <script>
      const form = document.querySelector("form");
      // console.log(form);
        form.addEventListener("submit", function (e) {
        e.preventDefault();
        const height = parseInt(document.querySelector("#height").value);
        const weight = parseInt(document.querySelector("#weight").value);
        const result = document.querySelector("#result");

        if (height === 0 || height < 0 || isNaN(height)) {
           result.innerHTML = "plese give the valid height";
        } else if (weight === 0 || weight < 0 || isNaN(weight)) {
          result.innerHTML = "plese give the valid weight";
        }else{
          const bmi = (weight / ((height * height)/10000)).toFixed(2);
          if (bmi < 18.6){
            result.innerHTML = `<span>${bmi}</span>`;
            result.innerHTML = "Under weight";
          }else if(bmi > 18.6 & bmi < 24.9){
            result.innerHTML = `<span>${bmi}</span>`;
            result.innerHTML = "Normal Range";
          }else{
            result.innerHTML = `<span>${bmi}</span>`;
            result.innerHTML = "overweight";
          }
        }
      });
    </script>
  </body>
</html>
