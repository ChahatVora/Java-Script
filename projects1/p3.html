<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>project 3</title>
</head>
<body>
    <div id="clock"></div>
    <script>
        const clock = document.querySelector("#clock");
            setInterval(function() {
            let date = new Date();
            clock.innerHTML = date.toLocaleTimeString();
            
        }, 1000);
        
    </script>
    
</body>
</html>
