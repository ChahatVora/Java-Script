<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>optimized way to create element and edit and remove</title>
  </head>
  <body>
    <div class="main">
      <ul class="ul">
        <li>python</li>
      </ul>
    </div>

    <script>
      fun1 = (lang) => {
        const li1 = document.createElement("li");
        li1.appendChild(document.createTextNode(lang));
        document.querySelector(".ul").appendChild(li1);
      }
    //   fun1("java script")

      fun2 = (lang) => {
        const li1 = document.createElement("li");
        li1.innerHTML = `${lang}`;
        document.querySelector(".ul").appendChild(li1);
      }
      fun2("java script")

      //edit
      const second_child = document.querySelector("li:nth-child(2)")
      const li2 = document.createElement("li")
      li2.textContent = "cpp"
      second_child.replaceWith(li2)

      //remove

      const first_child = document.querySelector("li:nth-child(1)")
      first_child.remove()

      

    </script>
  </body>
</html>
